let calling=false,connected=false,callSeconds=0,callTicker=null,callOriginalPage='lock',callSound=null;
function stopCallTimer(){if(callTicker!==null){clearInterval(callTicker);callTicker=null}}
function callOverlay(){return document.getElementById('fictional-call-overlay')}
function callDisplayTime(){const m=String(Math.floor(callSeconds/60)).padStart(2,'0'),s=String(callSeconds%60).padStart(2,'0');return m+':'+s}
function renderCall(){let overlay=callOverlay();if(!calling){if(overlay)overlay.remove();return}if(!overlay){overlay=document.createElement('section');overlay.id='fictional-call-overlay';overlay.className='call-layer';phone.querySelector('.screen').appendChild(overlay)}overlay.innerHTML=connected?`<div class="call-name">🥁 합주실</div><div class="call-state">통화 중 · <span id="call-duration">${callDisplayTime()}</span></div><div class="call-avatar">🐻</div><div class="call-spacer"></div><div class="call-tools"><button onclick="this.classList.toggle('on')">🔇<br>음소거</button><button onclick="this.classList.toggle('on')">🔊<br>스피커</button><button onclick="this.classList.toggle('on')">⌨️<br>키패드</button></div><div class="call-actions"><button onclick="endCall()"><span class="call-round">☎</span>통화 종료</button></div>`:`<div class="call-name">🥁 합주실</div><div class="call-state">성진이 형 · 전화 오는 중…</div><div class="call-avatar">🐻</div><div class="call-spacer"></div><div class="call-actions"><button onclick="endCall()"><span class="call-round">☎</span>거절</button><button class="accept" onclick="answerCall()"><span class="call-round">☎</span>받기</button></div>`}
function incomingCall(){endCall();callOriginalPage=page;calling=true;connected=false;callSeconds=0;renderCall()}
function answerCall(){if(!calling)return;connected=true;callSeconds=0;renderCall();stopCallTimer();callTicker=setInterval(()=>{callSeconds++;const timer=document.getElementById('call-duration');if(timer)timer.textContent=callDisplayTime()},1000)}
